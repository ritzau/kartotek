[package]
name = "kartotek"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "0BSD"
description = "A read-only local disk and backup catalog"

[dependencies]
libc = "=0.2.190"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
